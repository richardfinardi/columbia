<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="LOGO MINIMALISTA.png">
  <link rel="apple-touch-icon" href="LOGO MINIMALISTA.png">
  <title>Columbia Machine | Aplicações</title>
  <script>
    if (!localStorage.getItem('columbia_analista_token')) window.location.href = 'login.html';
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{columbia:{50:'#f0f7ff',100:'#e0effe',500:'#1d72b8',600:'#155b96',700:'#003e7e',800:'#002e61',900:'#001e40'}}}}};</script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800 font-sans">
  <header class="bg-columbia-700 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between gap-4">
      <div class="flex items-center gap-3 min-w-0">
        <div class="bg-white rounded-xl p-1.5"><img src="./logo.png" class="h-9 w-auto object-contain" alt="Columbia Machine"></div>
        <div class="min-w-0"><h1 class="text-lg sm:text-xl font-extrabold truncate">Columbia Machine Brasil</h1><p class="text-xs text-columbia-100">Aplicações e análises</p></div>
      </div>
      <div class="flex items-center gap-2">
        <span id="userDisplay" class="hidden sm:inline text-xs font-bold bg-columbia-800 px-3 py-2 rounded-xl"></span>
        <button onclick="logout()" class="flex items-center gap-1.5 px-3 py-2 bg-red-600 hover:bg-red-700 rounded-xl text-xs font-bold"><i data-lucide="log-out" class="w-4 h-4"></i>Sair</button>
      </div>
    </div>
  </header>
  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-8">
    <div class="mb-6"><h2 class="text-2xl sm:text-3xl font-black text-slate-900">Menu</h2><p class="text-sm text-slate-500 mt-1">Escolha o módulo que deseja acessar.</p></div>
    <section class="grid md:grid-cols-2 gap-5">
      <a href="conferencia/" class="group bg-white rounded-3xl border border-slate-200 shadow-sm hover:shadow-lg hover:-translate-y-0.5 transition p-6 sm:p-7">
        <div class="w-12 h-12 rounded-2xl bg-blue-50 text-columbia-700 flex items-center justify-center mb-5"><i data-lucide="clipboard-check" class="w-6 h-6"></i></div>
        <div class="flex items-start justify-between gap-3"><div><h3 class="text-xl font-black text-slate-900">Conferência</h3><p class="text-sm text-slate-500 mt-2 leading-relaxed">Análise de clientes, fornecedores, materiais, comercial, compras e cadastros.</p></div><i data-lucide="arrow-right" class="w-5 h-5 text-slate-400 group-hover:text-columbia-700 shrink-0 mt-1"></i></div>
      </a>
      <a href="notas_fiscais/" class="group bg-white rounded-3xl border border-slate-200 shadow-sm hover:shadow-lg hover:-translate-y-0.5 transition p-6 sm:p-7">
        <div class="w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-700 flex items-center justify-center mb-5"><i data-lucide="receipt-text" class="w-6 h-6"></i></div>
        <div class="flex items-start justify-between gap-3"><div><h3 class="text-xl font-black text-slate-900">Notas Fiscais</h3><p class="text-sm text-slate-500 mt-2 leading-relaxed">Faturamento, comparativos, devoluções, sucata e consulta detalhada de notas.</p></div><i data-lucide="arrow-right" class="w-5 h-5 text-slate-400 group-hover:text-emerald-700 shrink-0 mt-1"></i></div>
      </a>
    </section>
  </main>
  <script>
    const TOKEN_KEY='columbia_analista_token';
    document.getElementById('userDisplay').textContent=localStorage.getItem('columbia_analista_usuario')||'Usuário';
    function logout(){localStorage.removeItem(TOKEN_KEY);localStorage.removeItem('columbia_analista_usuario');localStorage.removeItem('columbia_analista_cod_responsavel');window.location.href='login.html'}
    lucide.createIcons();
  </script>
</body>
</html>
