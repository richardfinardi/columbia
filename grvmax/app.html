n:hover{border-color:var(--accent)}.primary{background:#115d9e;border-color:#115d9e;color:#fff}.primary:hover{background:#0a4d88;color:#fff}.danger{color:var(--bad)}.btn:disabled{opacity:.45;cursor:wait}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px}.statgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin:15px 0 25px}.stat{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:18px}.stat .value{font-weight:800;font-size:28px;letter-spacing:-1px;margin-top:7px}.stat .muted{font-size:12px}.twocol{display:grid;grid-template-columns:1.25fr .75fr;gap:18px}.sectiontitle{font-size:16px;font-weight:800;margin:2px 0 16px}.progress{height:8px;background:var(--line);border-radius:10px;overflow:hidden}.progress span{display:block;background:#1489c7;height:100%;border-radius:10px}.listrow{padding:13px 0;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;justify-content:space-between}.listrow:last-child{border-bottom:0}.pill{padding:5px 9px;border-radius:99px;display:inline-block;font-size:10px;font-weight:800;white-space:nowrap;background:#e7effa;color:#276095}.pill.ok{background:#d6f8e9;color:#08744f}.pill.bad{background:#ffdee2;color:#a6323e}.pill.warn{background:#fff1cf;color:#966306}.pill.neutral{background:#e8eaf0;color:#617084}.tablewrap{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow-x:auto}.grid{width:100%;border-collapse:collapse;white-space:nowrap;text-align:left;font-size:12px}.grid th{background:var(--bg);color:var(--sub);font-size:11px;text-transform:uppercase;letter-spacing:.35px;padding:13px;border-bottom:1px solid var(--line)}.grid td{padding:13px;border-bottom:1px solid var(--line);max-width:380px;overflow:hidden;text-overflow:ellipsis}.grid tr:last-child td{border-bottom:0}.grid tr:hover td{background:var(--bg)}.grid .title{font-weight:700;white-space:normal;min-width:190px}.link{backgr <script>
(function(){
'use strict';
var token=sessionStorage.getItem('grvmax_session')||'';
var S=null,screen='dashboard',search='',filterStage='',filterStatus='',inviteToken='',inviteEmail='',dark=localStorage.getItem('grvmax_dark')==='1';
if(dark)document.body.classList.add('dark');
var tabs=[['dashboard','◫','Dashboard'],['stages','▦','Etapas'],['activities','☷','Atividades'],['mine','✓','Minhas atividades'],['approvals','◈','Homologações'],['people','♙','Pessoas'],['emails','✉','Comunicação'],['agenda','▣','Agenda'],['pending','⚑','Pendências'],['changes','⇄','Mudanças'],['training','▤','Treinamentos'],['golive','◉','GO LIVE'],['history','≡','Histórico / Logs']];
var defs={
 ETAPAS:[['ORDEM','Ordem','number'],['TITULO','Título','text','wide'],['DESCRICAO','Descrição','textarea','wide'],['ENTREGAVEL','Entregável','textarea','wide'],['RESPONSAVEL_ID','Responsável','person'],['STATUS','Situação','stagesStatus'],['OBRIGATORIA','Obrigatória','bool']],
 ATIVIDADES:[['ETAPA_ID','Etapa','stage'],['TITULO','Atividade','text','wide'],['DESCRICAO','Instruções','textarea','wide'],['RESPONSAVEL_ID','Responsável principal','person'],['__PARTICIPANTES','Participantes da atividade','peopleMultiple','wide'],['__HOMOLOGADOR','Homologador designado','homologator','wide'],['STATUS','Situação','activityStatus'],['PRIORIDADE','Prioridade','priority'],['DATA_ORIENTACAO','Data da orientação','date'],['PRAZO','Prazo de validação','date'],['CRITERIO_ACEITE','Critério de aceite','textarea','wide'],['EVIDENCIA_URL','Link da evidência','text','wide'],['OBSERVACAO','Observações','textarea','wide'],['DEPENDE_DE','Depende de','activity'],['OBRIGATORIA','Obrigatória','bool']],
 PESSOAS:[['NOME','Nome','text','wide'],['EMAIL','E-mail de acesso','email','wide'],['EMPRESA','Empresa','text'],['DEPARTAMENTO','Departamento','text'],['CARGO','Cargo','text'],['PERFIL','Perfil','role'],['ATIVO','Ativo','bool']],
 PENDENCIAS:[['ATIVIDADE_ID','Atividade','activity'],['TITULO','Título','text','wide'],['DESCRICAO','Descrição','textarea','wide'],['RESPONSAVEL_ID','Responsável','person'],['PRIORIDADE','Prioridade','priority'],['STATUS','Situação','pendingStatus'],['IMPACTO','Impacto','textarea','wide'],['PRAZO','Prazo','date']],
 MUDANCAS:[['ETAPA_ID','Etapa','stage'],['ATIVIDADE_ID','Atividade','activity'],['TITULO','Solicitação','text','wide'],['DESCRICAO','Descrição','textarea','wide'],['IMPACTO','Impacto','textarea','wide'],['STATUS','Situação','changeStatus']],
 AGENDA:[['TIPO','Tipo','agendaType'],['TITULO','Compromisso','text','wide'],['DESCRICAO','Descrição','textarea','wide'],['INICIO','Data inicial','date'],['FIM','Data final','date'],['RESPONSAVEL_ID','Responsável','person'],['PARTICIPANTES','Participantes (IDs / observação)','text','wide'],['ATIVIDADE_ID','Atividade','activity'],['STATUS','Situação','agendaStatus']],
 TREINAMENTOS:[['ETAPA_ID','Etapa','stage'],['TITULO','Treinamento','text','wide'],['VIDEO_URL','URL do vídeo','text','wide'],['PARTICIPANTES','Participantes','text','wide'],['DATA','Data','date'],['STATUS','Situação','agendaStatus'],['EVIDENCIA_URL','Evidência','text','wide']],
 GO_LIVE:[['CRITERIO','Critério','textarea','wide'],['STATUS','Situação','goStatus'],['RESPONSAVEL_ID','Responsável','person'],['EVIDENCIA_URL','Link da evidência','text','wide'],['OBRIGATORIO','Obrigatório','bool']]
};
var tableNames={ETAPAS:'Etapa',ATIVIDADES:'Atividade',PESSOAS:'Pessoa',PENDENCIAS:'Pendência',MUDANCAS:'Mudança',AGENDA:'Agenda',TREINAMENTOS:'Treinamento',GO_LIVE:'Critério GO LIVE'};
function el(id){return document.getElementById(id)}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function attr(v){return esc(v)}
function api(action,payload,auth){
 return new Promise(function(resolve,reject){google.script.run.withSuccessHandler(resolve).withFailureHandler(function(e){reject(Error(e.message||String(e)))}).api(action,payload||{},auth===undefined?token:auth)})
}
function notify(msg,err){var n=el('toast');n.textContent=msg;n.style.background=err?'#9a283d':'#133e60';n.classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(function(){n.classList.add('hidden')},5500)}
function busy(b){document.querySelectorAll('[data-save]').forEach(function(x){x.disabled=b});}
async function start(){
 try{
   var init=await api('bootstrap',{},'');
   google.script.url.getLocation(async function(loc){
     var params=loc&&loc.parameter||{};
     inviteToken=params.invite||'';inviteEmail=params.email||'';
     if(inviteToken){authScreen('invite');return}
     if(init.needsSetup){authScreen('setup');return}
     if(token){try{await reload();return}catch(e){token='';sessionStorage.removeItem('grvmax_session')}}
     authScreen('login');
   });
 }catch(e){el('app').innerHTML='<div class="auth"><div class="authbox"><h2>Não foi possível conectar</h2><div class="alert">'+esc(e.message)+'</div><button class="btn" onclick="location.reload()">Tentar novamente</button></div></div>'}
}
function authScreen(mode){
 var title=mode==='setup'?'Configuração inicial':mode==='invite'?'Defina sua senha':mode==='forgot'?'Recuperar acesso':'Acessar implantação';
 var input='<label>E-mail</label><input class="field" id="mail" autocomplete="email" type="email" value="'+attr(inviteEmail)+'" placeholder="usuario@empresa.com.br">';
 if(mode==='setup')input='<label>Nome</label><input class="field" id="personName" placeholder="Seu nome">'+input+'<label>Chave de configuração</label><input class="field" id="setupKey" type="password" placeholder="Definida nas propriedades do script">';
 if(mode==='login'||mode==='setup'||mode==='invite')input+='<label>Senha</label><input class="field" id="password" type="password" autocomplete="'+(mode==='login'?'current-password':'new-password')+'" minlength="10" placeholder="Sua senha">';
 var btn=mode==='login'?'Entrar':mode==='setup'?'Criar administrador':mode==='invite'?'Definir senha':'Enviar recuperação';
 el('app').innerHTML='<div class="auth"><div class="authbox"><div class="brand-icon" style="margin-bottom:20px;width:54px;height:54px"><img src="https://consultoriarf.net/columbia/LOGO%20MINIMALISTA.png" alt="Consultoria RF"></div><div class="bold" style="font-size:12px;color:#32709f">COLUMBIA MACHINE</div><h1>GRVMAX</h1><p style="color:#68768a;font-size:13px">Gestão da Implantação ERP</p><h2 style="font-size:17px;margin-top:24px">'+title+'</h2><form onsubmit="return false" id="authForm">'+input+'<div id="authError"></div><button type="submit" class="btn primary" id="authSubmit">'+btn+'</button></form>'+(mode==='login'?'<button class="link" id="forgotLink">Esqueci minha senha</button>':'')+(mode==='forgot'?'<button class="link" id="backLogin">Voltar ao login</button>':'')+'</div></div>';
 el('authForm').onsubmit=function(ev){ev.preventDefault();authSubmit(mode)};
 if(el('forgotLink'))el('forgotLink').onclick=function(){authScreen('forgot')};
 if(el('backLogin'))el('backLogin').onclick=function(){authScreen('login')};
}
async function authSubmit(mode){
 var btn=el('authSubmit'),mail=el('mail').value.trim(),password=el('password')?el('password').value:'';
 btn.disabled=true;el('authError').innerHTML='';
 try{
  if(mode==='setup'){await api('setup',{name:el('personName').value,email:mail,password:password,key:el('setupKey').value},'');notify('Administrador criado. Faça login.');authScreen('login');return}
  if(mode==='forgot'){var m=await api('forgot',{email:mail},'');notify(m.message||'Verifique seu e-mail.');authScreen('login');return}
  if(mode==='invite'){await api('setPassword',{email:mail,password:password,invite:inviteToken},'');notify('Senha definida. Acesse sua conta.');inviteToken='';inviteEmail='';authScreen('login');return}
  var l=await api('login',{email:mail,password:password},'');token=l.token;sessionStorage.setItem('grvmax_session',token);await reload();
 }catch(e){el('authError').innerHTML='<div class="alert">'+esc(e.message)+'</div>'}
 finally{if(btn)btn.disabled=false}
}
async function reload(silent){
 try{var data=await api('state');S=data;render();if(!silent)notify('Dados atualizados.');}
 catch(e){notify(e.message,true);if(/Sessão|sessão|expirada/.test(e.message)){token='';sessionStorage.removeItem('grvmax_session');authScreen('login')}throw e;}
}
function nav(name){screen=name;search='';filterStage='';filterStatus='';render();}
function activityTeam(id,type){return (S.vinculos||[]).filter(function(v){return v.ATIVIDADE_ID===id&&v.TIPO===type}).map(function(v){return v.PESSOA_ID})}
function canApprove(id){return S.canEdit||activityTeam(id,'HOMOLOGADOR').includes(S.me.ID)}
function person(id){var x=S.people.find(function(p){return p.ID===id});return x?x.NOME:'—'}
function stage(id){var x=S.stages.find(function(p){return p.ID===id});return x?x.TITULO:'—'}
function fmt(dt){if(!dt)return '—';var s=String(dt);if(s.length>=10&&s[4]==='-')return s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4);return s}
function badge(s){var cls=/Homologada|Aprovad|Resolvida|Conclu/.test(s)?'ok':/Atrasada|Devolvida|Bloquead|Crítica|Cancelada/.test(s)?'bad':/Aguardando|Pendente|Em execução|Orientada|andamento/.test(s)?'warn':'neutral';return '<span class="pill '+cls+'">'+esc(s||'—')+'</span>'}
function pct(stid){var xs=S.activities.filter(function(a){return a.ETAPA_ID===stid});return xs.length?Math.round(xs.filter(function(a){return a.STATUS==='Homologada'}).length*100/xs.length):0}
function overall(){return S.activities.length?Math.round(S.activities.filter(function(a){return a.STATUS==='Homologada'}).length*100/S.activities.length):0}
function authorized(){return S.canEdit}
function render(){
 if(!S)return;
 var tab=tabs.find(function(t){return t[0]===screen})||tabs[0];
 var m='<div class="shell"><aside class="nav"><div class="brand"><div class="brand-icon"><img src="https://consultoriarf.net/columbia/LOGO%20MINIMALISTA.png" alt="Consultoria RF"></div><div><b>GRVMAX</b><small>Gestão da Implantação</small></div></div><div class="navlinks">'+tabs.map(function(t){return '<a class="'+(screen===t[0]?'active':'')+'" href="#" data-nav="'+t[0]+'"><span class="ico">'+t[1]+'</span>'+t[2]+'</a>'}).join('')+'</div><div class="navfoot"><strong>COLUMBIA MACHINE</strong><br>Implantação ERP • Ambiente independente</div></aside><div class="area"><header class="top"><div><h1>'+esc(tab[2])+'</h1><span class="small muted">Projeto GRVMAX ERP · Columbia Machine</span></div><div class="top-right"><span class="small muted" id="lastUpdate">Atualizado agora</span><button class="btn" id="refreshBtn" title="Atualizar">↻</button><button class="btn" id="themeBtn" title="Tema">◑</button><button class="btn" id="logoutBtn">Sair</button></div></header><main class="page" id="content"></main></div></div>';
 el('app').innerHTML=m;
 document.querySelectorAll('[data-nav]').forEach(function(a){a.onclick=function(ev){ev.preventDefault();nav(a.dataset.nav)}});
 el('refreshBtn').onclick=function(){reload()};
 el('themeBtn').onclick=function(){dark=!dark;document.body.classList.toggle('dark',dark);localStorage.setItem('grvmax_dark',dark?'1':'0')};
 el('logoutBtn').onclick=async function(){try{await api('logout')}catch(e){}token='';sessionStorage.removeItem('grvmax_session');S=null;authScreen('login')};
 var content=el('content');
 switch(screen){case 'dashboard':dashboard(content);break;case 'stages':stagesView(content);break;case 'activities':activitiesView(content);break;case 'mine':activitiesView(content,true);break;case 'approvals':approvalsView(content);break;case 'people':peopleView(content);break;case 'emails':emailsView(content);break;case 'agenda':genericView(content,'AGENDA',S.agenda);break;case 'pending':genericView(content,'PENDENCIAS',S.pending);break;case 'changes':genericView(content,'MUDANCAS',S.changes);break;case 'training':genericView(content,'TREINAMENTOS',S.trainings);break;case 'golive':goLiveView(content);break;case 'history':historyView(content);break;}
}
function createButton(tbl){return S.canEdit||tbl==='PESSOAS'&&S.canAdmin?'<button class="btn primary" onclick="editItem(\''+tbl+'\')">+ Novo cadastro</button>':''}
function dashboard(root){
 var a=S.activities,hom=a.filter(function(x){return x.STATUS==='Homologada'}).length,waiting=a.filter(function(x){return x.STATUS==='Aguardando validação'}).length;

 };

 function decision(type){return async function(){busy(true);try{await api('approve',{id:id,decision:type,note:el('decisionNote').value});closePop();await reload(true);notify('Decisão registrada e auditada.')}catch(e){notify(e.message,true)}finally{busy(false)}}}
 el('rejectBtn').onclick=decision('Devolvida');el('approveBtn').onclick=decision('Homologada');
};
window.invitePerson=async function(id){if(!confirm('Enviar link individual para definição de senha?'))return;try{var r=await api('invite',{id:id});await reload(true);notify(r.ok?'Convite enviado e registrado.':'Falha no envio. Confira a aba Comunicação.',!r.ok)}catch(e){notify(e.message,true)}};
window.compose=function(){
 modal('Nova comunicação','<p class="muted small">Selecione os destinatários. Cada envio será individual e terá registro detalhado em COMUNICACOES e LOGS.</p><div class="toolbar"><button class="btn" id="allPeople">Selecionar todos</button><button class="btn" id="nonePeople">Limpar seleção</button></div><div class="checkgrid" id="recipients">'+S.people.map(function(p){return '<label class="checkitem"><input type="checkbox" value="'+p.ID+'" class="recipient">'+esc(p.NOME)+'<div class="tiny muted">'+esc(p.EMAIL)+'</div></label>'}).join('')+'</div><div class="formgrid"><div class="fitem wide"><label>Assunto</label><input class="field" id="mailSubject" value="GRVMAX | Orientações da implantação"></div><div class="fitem wide"><label>Atividade vinculada (opcional)</label><select class="field" id="mailActivity">'+options('','activity')+'</select></div><div class="fitem wide"><label>Mensagem</label><textarea class="field" rows="7" id="mailBody" placeholder="Descreva as orientações e o prazo..."></textarea></div></div>','<button class="btn" onclick="closePop()">Cancelar</button><button class="btn primary" data-save id="sendBtn">Enviar e registrar</button>');
 el('allPeople').onclick=function(){document.querySelectorAll('.recipient').forEach(function(c){c.checked=true})};el('nonePeople').onclick=function(){document.querySelectorAll('.recipient').forEach(function(c){c.checked=false})};
 el('sendBtn').onclick=async function(){var peopleIds=Array.from(document.querySelectorAll('.recipient:checked')).map(function(c){return c.value});busy(true);try{var r=await api('sendEmail',{peopleIds:peopleIds,subject:el('mailSubject').value,body:el('mailBody').value,activityId:el('mailActivity').value});closePop();await reload(true);notify(r.results.filter(function(x){return x.status==='ENVIADO'}).length+' de '+r.results.length+' e-mails enviados e auditados.')}catch(e){notify(e.message,true)}finally{busy(false)}};
};
window.sendReminders=async function(){if(!confirm('Enviar lembretes dos prazos próximos/atrasados? Evita repetições no mesmo dia.'))return;try{var r=await api('reminders');await reload(true);notify(r.total+' lembretes processados; erros: '+r.errors)}catch(e){notify(e.message,true)}};
window.installReminders=async function(){if(!confirm('Ativar disparo automático diário de lembretes às 8h?'))return;try{await api('installReminders');await reload(true);notify('Lembretes diários ativados.')}catch(e){notify(e.message,true)}};
window.goDecision=async function(decision){var note=prompt('Justificativa da decisão '+decision+':');if(note===null)return;try{await api('goDecision',{decision:decision,note:note});await reload(true);notify('Decisão '+decision+' auditada.')}catch(e){notify(e.message,true)}};
window.nav=nav;
start();
})();
