<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/png" href="../LOGO MINIMALISTA.png">
  <title>Conferência | Columbia Machine</title>
  <style>
    :root { color-scheme: light; font-family: Inter, Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:#f1f5f9; color:#0f172a; }
    main { width:min(100%,520px); padding:40px 34px; background:#fff; border:1px solid #e2e8f0; border-radius:22px; box-shadow:0 14px 35px rgba(15,23,42,.06); text-align:center; }
    .badge { display:inline-block; color:#003e7e; background:#e0effe; font-size:12px; font-weight:800; letter-spacing:.06em; border-radius:999px; padding:9px 14px; text-transform:uppercase; }
    h1 { margin:24px 0 14px; font-size:clamp(24px,5vw,32px); line-height:1.15; }
    p { margin:0 auto 26px; max-width:390px; font-size:15px; line-height:1.65; color:#475569; }
    a { display:inline-block; text-decoration:none; color:#fff; background:#003e7e; font-size:14px; font-weight:700; padding:13px 21px; border-radius:12px; }
    a:hover, a:focus-visible { background:#002e61; }
  </style>
</head>
<body>
  <main>
    <span class="badge">Columbia Machine</span>
    <h1>Módulo Conferência em reformulação</h1>
    <p>A versão anterior foi preservada em backup. Esta área ficará indisponível enquanto a nova tela é construída.</p>
    <a href="../">Voltar às aplicações</a>
  </main>
</body>
</html>
