<div id="columnFilterModal" class="filter-modal-backdrop hidden" onclick="if(event.target===this)closeColumnFilter()">

<script>
const API_NOTAS='https://columbia.consultoriarf.net/notas_fiscais';
const API_ORC='https://columbia.consultoriarf.net/orcamento_class';
const API_DEV='https://columbia.consultoriarf.net/orc_nf_dev';
const CACHE_DB='columbia_notas_cache_v1', CACHE_STORE='dados', CACHE_KEY='payload';
let rawNotas=[], notas=[], orcamentos=[], vinculos=[], viewAtual='faturamento', notasView='faturamento', page=1, pageSize=100;
let selectedYears=new Set(), selectedMonths=new Set(), periodInitialized=false;
let columnFilters={}, sortState={key:'data',dir:'desc'}, activeFilterColumn=null, tempFilterSelection=new Set();
let expandedComparativo=new Set();
let comparativoInitialized=false;
let chartSegmento=null, chartClientes=null, filterTimer=null;
const meses=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

function num(v){const n=Number(v);return Number.isFinite(n)?n:0}
function fmtBRL(v){return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(num(v))}
function fmtInt(v){return new Intl.NumberFormat('pt-BR',{maximumFractionDigits:0}).format(num(v))}
function esc(v){return String(v==null?'':v).replace(/[&<>'"]/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]})}
function norm(v){return String(v==null?'':v).trim().toUpperCase()}
function dateOnly(v){if(!v)return'';return String(v).slice(0,10)}
function dateBR(v){const s=dateOnly(v);if(!s)return'-';const p=s.split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:s}
function objLower(o){const r={};Object.keys(o||{}).forEach(function(k){r[String(k).toLowerCase()]=o[k]});return r}


const NOTAS_COLUMNS={
  faturamento:[
    ['mes_ano','MÊS/ANO','text'],['nf','NF','text'],['data','Data','date'],['cliente','CLIENTE','text'],['cnpj','CNPJ','text'],['cfop','CFOP','text'],['status','STATUS','text'],
    ['vl_faturado','Faturamento','money',1],['vl_frete','Frete','money',1],['vl_nota','Total da nota','money',1],['outras_despesas','Outras Desp.','money',1],
    ['icms','ICMS','money',1],['pis','PIS','money',1],['cofins','COFINS','money',1],['ipi','IPI','money',1],['iss','ISS','money',1],['segmento_final','Segmento','text'],['tipo','TIPO','text'],['obs_nota','Observação da Nota','text']
  ],
  sucata:[
    ['mes_ano','MÊS/ANO','text'],['nf','NF','text'],['data','DT_EMISSAO','date'],['cliente','CLIENTE','text'],['cnpj','CNPJ','text'],['cfop','CFOP','text'],['status','STATUS','text'],
    ['vl_faturado','VL FATURADO','money',1],['icms','ICMS','money',1],['pis','PIS','money',1],['cofins','COFINS','money',1],['ipi','IPI','money',1],['segmento_final','Segmento','text'],['obs_nota','Observação da Nota','text']
  ],
  devolucoes:[
    ['mes_ano','MÊS/ANO','text'],['nf','NF','text'],['data','DT_EMISSAO','date'],['cliente','CLIENTE','text'],['cnpj','CNPJ','text'],['cfop','CFOP','text'],['status','STATUS','text'],
    ['vl_nota','VL NF','money',1],['icms','ICMS','money',1],['pis','PIS','money',1],['cofins','COFINS','money',1],['ipi','IPI','money',1],['segmento_final','Segmento','text'],['tipo','TIPO','text'],['nf_referenciada','NF_REFERENCIADA1','text'],['tp_nf','tp_nf','text'],['obs_nota','Observação da Nota','text']
  ],
  canceladas:[
    ['mes_ano','MÊS/ANO','text'],['nf','NF','text'],['data','DT_EMISSAO','date'],['cliente','CLIENTE','text'],['cnpj','CNPJ','text'],['cfop','CFOP','text'],['status','STATUS','text'],
    ['vl_faturado','VL FATURADO','money',1],['vl_nota','VL NF','money',1],['icms','ICMS','money',1],['pis','PIS','money',1],['cofins','COFINS','money',1],['ipi','IPI','money',1],['segmento_final','Segmento','text'],['tipo','TIPO','text'],['obs_nota','Observação da Nota','text']
  ],
  todas:[
    ['mes_ano','MÊS/ANO','text'],['nf','NF','text'],['data','DT_EMISSAO','date'],['cliente','CLIENTE','text'],['cnpj','CNPJ','text'],['cfop','CFOP','text'],['status','STATUS','text'],
    ['vl_faturado','Faturamento','money',1],['vl_frete','Frete','money',1],['vl_nota','Total da nota','money',1],['outras_despesas','Outras Desp.','money',1],
    ['icms','ICMS','money',1],['pis','PIS','money',1],['cofins','COFINS','money',1],['ipi','Soma de ipi','money',1],['iss','ISS','money',1],['segmento_final','Segmento','text'],['tipo','TIPO','text'],['obs_nota','Observação da Nota','text']
  ]
};
function columnsForView(){return (NOTAS_COLUMNS[notasView]||NOTAS_COLUMNS.todas).map(function(x){return {key:x[0],label:x[1],type:x[2],sum:!!x[3]}})}
function mesAno(r){return r.mes&&r.ano?meses[r.mes-1].slice(0,3).toLowerCase()+'/'+r.ano:''}
function colRaw(col,r){return col.key==='mes_ano'?mesAno(r):r[col.key]}
function colToken(col,r){const v=colRaw(col,r);return col.type==='money'?String(num(v)):String(v==null?'':v)}
function colDisplay(col,r){const v=colRaw(col,r);if(col.type==='money')return fmtBRL(v);if(col.type==='date')return dateBR(v);return String(v==null?'':v)}
function normalizeNota(row){
  const r=objLower(row);
  return {
    tipo:String(r.tipo||'').trim(), data:dateOnly(r.data||r.dt_emissao), nf:String(r.nf||'').trim(),
    cliente:String(r.cliente||r.razao_social||'').trim(), cnpj:String(r.cnpj||'').trim(), cfop:String(r.cfop||'').trim(),
    status:String(r.status||'').trim(), vl_nota:num(r.vl_nota||r.vl_total), vl_faturado:num(r.vl_faturado||r.vl_faturameto||r.vl_faturamento),
    icms:num(r.icms||r.vl_icms), pis:num(r.pis||r.vl_pis), cofins:num(r.cofins||r.vl_cofins),
    segmento:String(r.segmento||'').trim(), nf_faturamento:String(r.nf_faturamento||'').trim(), nf_referenciada:String(r.nf_referenciada||'').trim(),
    tp_nf:String(r.tp_nf||'').trim(), iss:num(r.iss), orc_dev:String(r.orc_dev||'').trim(), vl_frete:num(r.vl_frete),
    frete_por_conta:String(r.frete_por_conta==null?'':r.frete_por_conta).trim(), ipi:num(r.ipi),
    obs_nota:String(r.obs_nota||r.obs_text||'').trim(), outras_despesas:num(r.outras_despesas)
  };
}

function buildSegmentMaps(){
  const orcMap=new Map(), nfMap=new Map();
  orcamentos.forEach(function(x){const r=objLower(x),k=norm(r.n_orcamento),s=String(r.classificacao||'').trim();if(k&&s&&!orcMap.has(k))orcMap.set(k,s)});
  vinculos.forEach(function(x){const r=objLower(x),k=norm(r.nf_vinc),s=String(r.segmento||'').trim();if(k&&s&&!nfMap.has(k))nfMap.set(k,s)});
  return {orcMap:orcMap,nfMap:nfMap};
}

function prepareData(){
  const maps=buildSegmentMaps();
  notas=rawNotas.map(normalizeNota).filter(function(r){
    const y=Number((r.data||'').slice(0,4));
    return y>2023 && !String(r.nf).includes('11825');
  }).map(function(r){
    let seg=r.segmento;
    let origem=seg?'NOTAS':'';
    if(!seg && r.orc_dev && maps.orcMap.has(norm(r.orc_dev))){seg=maps.orcMap.get(norm(r.orc_dev));origem='ORCAMENTO_CLASS'}
    if(!seg && r.nf_referenciada && maps.nfMap.has(norm(r.nf_referenciada))){seg=maps.nfMap.get(norm(r.nf_referenciada));origem='ORC_NF_DEV'}
    if(!seg && r.nf && maps.nfMap.has(norm(r.nf))){seg=maps.nfMap.get(norm(r.nf));origem='ORC_NF_DEV'}
    r.segmento_final=seg||'SEM CLASSIFICAÇÃO'; r.segmento_origem=origem||'SEM VÍNCULO';
    r.ano=Number((r.data||'').slice(0,4)); r.mes=Number((r.data||'').slice(5,7));
    return r;
  });
}

function isFat(r){return ['NF FATURADAS','NF SERVICO','SUCATA'].includes(norm(r.tipo)) && r.vl_faturado>0}
function isDev(r){
  const tipo=norm(r.tipo);
  if(tipo==='ENTRADA')return true;
  if(tipo==='EMISSAO DEVOLUCAO')return norm(r.tp_nf)==='CLIENTE';
  return false;
}
function devValue(r){return isDev(r)?r.vl_nota:0}
function isCancel(r){return ['CANCELADA','INUTILIZADA'].includes(norm(r.status)) || norm(r.tipo)==='NF INUT/CANC'}
function sum(arr,fn){return arr.reduce(function(a,x){return a+num(fn(x))},0)}
function metrics(rows){const bruto=sum(rows.filter(isFat),function(r){return r.vl_faturado});const devol=sum(rows.filter(isDev),function(r){return devValue(r)});return {bruto:bruto,devol:devol,liquido:bruto-devol}}

function updatePeriodLabels(){
  const years=[...selectedYears].sort(function(a,b){return a-b});
  const months=[...selectedMonths].sort(function(a,b){return a-b});

function buildComparativoMatrix(rows){
  const monthMap=new Map();
  rows.forEach(function(r){
    if(!r.ano||!r.mes)return;
    const key=r.ano+'-'+String(r.mes).padStart(2,'0');
    if(!monthMap.has(key))monthMap.set(key,{key:key,ano:r.ano,mes:r.mes,bruto:0,devol:0,segments:new Map()});
    const m=monthMap.get(key);
    const segKey=(r.segmento_final&&r.segmento_final!=='SEM CLASSIFICAÇÃO')?r.segmento_final:'';
    if(!m.segments.has(segKey))m.segments.set(segKey,{segmento:segKey,bruto:0,devol:0});
    const s=m.segments.get(segKey);
    if(isFat(r)){m.bruto+=r.vl_faturado;s.bruto+=r.vl_faturado}
    if(isDev(r)){const dv=devValue(r);m.devol+=dv;s.devol+=dv}
  });
  return [...monthMap.values()].map(function(m){
    m.liquido=m.bruto-m.devol;
    m.segmentos=[...m.segments.values()]
      .map(function(s){s.liquido=s.bruto-s.devol;return s})
      .filter(function(s){return s.bruto!==0||s.devol!==0})
      .sort(function(a,b){
        if(a.segmento===''&&b.segmento!=='')return -1;
        if(a.segmento!==''&&b.segmento==='')return 1;
        return a.segmento.localeCompare(b.segmento,'pt-BR',{numeric:true,sensitivity:'base'});
      });
    return m;
  }).filter(function(m){return m.bruto!==0||m.devol!==0})
    .sort(function(a,b){return a.key.localeCompare(b.key)});
}

function openDb(){return new Promise(function(resolve,reject){const req=indexedDB.open(CACHE_DB,1);req.onupgradeneeded=function(){if(!req.result.objectStoreNames.contains(CACHE_STORE))req.result.createObjectStore(CACHE_STORE)};req.onsuccess=function(){resolve(req.result)};req.onerror=function(){reject(req.error)}})}
async function cacheRead(){try{const db=await openDb();return await new Promise(function(resolve){const tx=db.transaction(CACHE_STORE,'readonly'),rq=tx.objectStore(CACHE_STORE).get(CACHE_KEY);rq.onsuccess=function(){resolve(rq.result||null)};rq.onerror=function(){resolve(null)}})}catch(e){return null}}
async function cacheWrite(v){try{const db=await openDb();await new Promise(function(resolve,reject){const tx=db.transaction(CACHE_STORE,'readwrite');tx.objectStore(CACHE_STORE).put(v,CACHE_KEY);tx.oncomplete=resolve;tx.onerror=function(){reject(tx.error)}})}catch(e){console.warn('cache',e)}}
async function fetchJson(url){
  const token=localStorage.getItem('columbia_analista_token');
  const r=await fetch(url+'?_t='+Date.now(),{cache:'no-store',headers:{'Cache-Control':'no-cache','Authorization':'Bearer '+token}});
  if(r.status===401){window.location.href='../login.html';throw new Error('Sessão expirada')}
  if(r.status===403){window.location.href='../';throw new Error('Usuário sem acesso a Notas Fiscais')}
  if(!r.ok)throw new Error(url+' — HTTP '+r.status);
  const d=await r.json();if(!Array.isArray(d))throw new Error('Formato inválido: '+url);return d
}

}
async function init(){
  setView('faturamento');
  const token=localStorage.getItem('columbia_analista_token');
  try{
    const access=await fetch('https://columbia.consultoriarf.net/producao/portal/me',{headers:{Authorization:'Bearer '+token},cache:'no-store'});
    if(access.status!==404&&access.status!==405){
      if(!access.ok)throw new Error('acesso');
      const p=await access.json();
      localStorage.setItem('columbia_permissoes',JSON.stringify(p));
      if(Number(p.u_notas||0)!==1){window.location.href='../';return}
    }
  }catch(e){window.location.href='../login.html';return}
  document.getElementById('loadingBox').classList.remove('hidden');
  const cached=await cacheRead();if(cached)await applyPayload(cached,'cache');
  document.getElementById('loadingBox').classList.add('hidden');
  await refreshAll(false);lucide.createIcons();
}
document.addEventListener('DOMContentLoaded',init);
</script>
